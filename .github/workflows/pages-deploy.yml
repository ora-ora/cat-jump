name: Deploy game to GitHub Pages + Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch: {}

permissions:
  # 显式声明 permissions 会把其余权限隐式设为 none；actions/checkout 需要
  # contents: read 才能正常拉取仓库，所以要和 pages/id-token 一起列出来。
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 注入版本号：部署时间（北京时间）v2026.10.21 01:45 · 短提交；短提交同时作为静态资源的缓存参数
      - name: Inject build version
        run: |
          SHA="${GITHUB_SHA::7}"
          VER="v$(TZ=Asia/Shanghai date '+%Y.%m.%d %H:%M')"
          printf 'window.CAT_BUILD = { version: "%s", sha: "%s" };\n' "$VER" "$SHA" > web/version.js
          sed -i "s/__BUILD__/${SHA}/g" web/index.html
          cat web/version.js
          grep -c "?v=${SHA}" web/index.html

      # Cloudflare Pages（meow.12121313.xyz 主站）；用同一份已注入版本号的 web/
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no Cloudflare token, skipping"; exit 0; fi
          npx --yes wrangler@3 pages deploy web --project-name cat-jump --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
