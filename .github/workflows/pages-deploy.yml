name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch: {}

permissions:
  # 显式声明 permissions 会把其余权限隐式设为 none；actions/checkout 需要
  # contents: read 才能正常拉取仓库，所以要和 pages/id-token 一起列出来。
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 注入版本号：v0.9.<部署序号> · 短提交 · 构建日期（北京时间）；同时作为静态资源的缓存参数
      - name: Inject build version
        run: |
          SHA="${GITHUB_SHA::7}"
          VER="v0.9.${GITHUB_RUN_NUMBER}"
          DATE="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          printf 'window.CAT_BUILD = { version: "%s", sha: "%s", date: "%s" };\n' "$VER" "$SHA" "$DATE" > web/version.js
          sed -i "s/__BUILD__/${SHA}/g" web/index.html
          cat web/version.js
          grep -c "?v=${SHA}" web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
