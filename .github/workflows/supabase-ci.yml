name: Supabase migration checks

on:
  pull_request:
    paths:
      - "supabase/**"

permissions:
  contents: read

jobs:
  lint-and-dry-run:
    runs-on: ubuntu-latest
    # actionlint 不允许 step 级 `if` 直接用 secrets 上下文，所以在 job 级
    # env 里先把它转成一个普通字符串，step 的 if 再读 env。
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Start local Supabase stack and apply all migrations
        run: supabase db start

      - name: Lint schema
        run: supabase db lint

      - name: Dry-run against remote (skipped on fork PRs without secrets)
        if: env.HAS_TOKEN == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
