<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a8de8e">
<title>小猫抓老鼠 Cat Mouse Chase</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="hudLeft">
      <div id="scoreText" class="hud-pill">0</div>
      <div id="comboText" class="hidden"></div>
      <div id="rankText" class="hud-pill small">排名：--</div>
      <div id="abilityBadge" class="hud-pill small ability-badge"></div>
    </div>
    <div id="hudRight">
      <button id="hudLbBtn" class="icon-btn lb-hud-btn" aria-label="排行榜">🏆<span>排行</span></button>
      <button id="pauseBtn" class="icon-btn" aria-label="暂停">⏸</button>
      <button id="muteBtn" class="icon-btn" aria-label="静音切换">🔊</button>
    </div>
  </div>

  <div id="evoBanner" class="evo-banner hidden" aria-live="polite"></div>

  <div id="startScreen" class="overlay">
    <div class="panel start-panel">
      <h1>小猫抓老鼠</h1>
      <canvas id="skinPreview" class="skin-preview" width="160" height="150" aria-hidden="true"></canvas>
      <div class="skin-name" id="skinName">橘子</div>
      <div class="skin-desc" id="skinDesc">活力满满的橘猫</div>
      <div class="skin-ability" id="skinAbility"></div>
      <div class="section-title">选择你的小猫</div>
      <div class="skin-grid" id="skinGrid" role="radiogroup" aria-label="选择小猫"></div>
      <label class="nickname-label" for="nicknameInput">昵称</label>
      <div class="nickname-row">
        <input id="nicknameInput" type="text" maxlength="12" placeholder="给自己起个昵称吧" autocomplete="off">
        <button id="diceBtn" class="dice-btn" type="button" aria-label="随机昵称"><span class="dice-face"><i></i><i></i><i></i><i></i><i></i></span></button>
      </div>
      <p class="nickname-hint hidden" id="nicknameHint">昵称包含不当词语，将使用默认昵称</p>
      <button id="startBtn" class="btn-primary btn-wide">开始抓老鼠 🐾</button>
      <button id="showLeaderboardBtnStart" class="btn-secondary">查看排行榜</button>
      <p class="best">历史最高分：<span id="bestScoreStart">0</span></p>
      <p class="hint">点击/按住屏幕任意方向移动，靠近老鼠就能抓住！不限时，随时可结束本局。桌面端可用方向键 / WASD。</p>
    </div>
  </div>

  <div id="pauseScreen" class="overlay hidden">
    <div class="panel">
      <h2>已暂停</h2>
      <button id="resumeBtn" class="btn-primary">继续</button>
      <button id="endRunBtn" class="btn-secondary">结束本局</button>
    </div>
  </div>

  <div id="confirmEndScreen" class="overlay hidden">
    <div class="panel">
      <h2>确定结束本局吗？</h2>
      <p class="hint">本局数据会被冻结并自动结算，游戏不会自动结束，误触可以取消。</p>
      <button id="confirmEndYesBtn" class="btn-primary">结束本局</button>
      <button id="confirmEndNoBtn" class="btn-secondary">继续游戏</button>
    </div>
  </div>

  <div id="resultScreen" class="overlay hidden">
    <div class="panel">
      <h2>本局结算</h2>
      <div class="result-stats">
        <div>得分：<span id="resultScore">0</span></div>
        <div>捕获数：<span id="resultCatches">0</span></div>
        <div>游玩时长：<span id="resultDuration">0</span> 秒</div>
        <div>本局最高连击：x<span id="resultCombo">0</span></div>
        <div>历史最高分：<span id="resultBest">0</span></div>
      </div>
      <div id="resultRankStatus">结算中…</div>
      <label class="nickname-label" for="nicknameInputResult">昵称（下一局生效）
        <input id="nicknameInputResult" type="text" maxlength="12" autocomplete="off">
      </label>
      <p class="nickname-hint hidden" id="nicknameHintResult">昵称包含不当词语，将使用默认昵称</p>
      <div class="btn-row">
        <button id="showLeaderboardBtnResult" class="btn-secondary">查看排行榜</button>
        <button id="restartBtn" class="btn-primary">再来一局</button>
      </div>
      <button id="homeBtn" class="btn-secondary">返回首页</button>
    </div>
  </div>

  <div id="leaderboardScreen" class="overlay hidden">
    <div class="panel">
      <h2>排行榜</h2>
      <p class="lb-sub hidden" id="lbSub">游戏已暂停 · 每 5 秒自动刷新</p>
      <div id="lbFilter" class="lb-filter" role="group" aria-label="按小猫筛选"></div>
      <div id="leaderboardList" class="leaderboard-list"></div>
      <button id="leaderboardCloseBtn" class="btn-secondary">关闭</button>
    </div>
  </div>
</div>
<script src="art.js"></script>
<script src="anim.js"></script>
<script src="game.js"></script>
</body>
</html>
